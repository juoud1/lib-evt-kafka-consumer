server.port=8282
server.servlet.context-path=/consumer

spring.application.name=lib-evt-consumer

# Kafka topic properties
#spring.kafka.topic.name=lib-evts-topic
#spring.kafka.topic.nombre-partitions=3
#spring.kafka.topic.nombre-replicas=1

# Dummy Header of Producer record 
#spring.kafka.producer-record.header.key=evt-source
#spring.kafka.producer-record.header.value=scanner

spring.config.activate.on-profile=local

spring.datasource.url=jdbc:h2:mem:././librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true

#https://www.danvega.dev/blog/spring-boot-4-modularization
spring.h2.console.enabled=true
#spring.h2.console.settings.web-allow-others=false
spring.h2.console.path=/h2-db

spring.kafka.template.default-topic=lib-evt-topic
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.IntegerDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=lib-evts-listeners-grp
#spring.kafka.producer.properties.acks= 1
#spring.kafka.producer.properties.retries= 7

#For integration test
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer 
 
#spring.kafka.admin.properties.bootstrap-servers=localhost:9092
#spring.kafka.admin.properties.retries= 7